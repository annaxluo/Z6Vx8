name: R-CMD-check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.0'
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libglpk-dev \
            libfontconfig1-dev \
            libcairo2-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev

      - name: Install R dependencies
        run: |
          options(repos = c(CRAN = "https://cloud.r-project.org"))

          install.packages("pak")
          pak::pkg_install(c(
            "BiocManager",
            "remotes",
            "rcmdcheck",
            "pkgload",
            "testthat",
            "bslib",
            "shiny",
            "htmlwidgets",
            "miniUI",
            "knitr",
            "rmarkdown",
            "dplyr",
            "ggrastr",
            "igraph",
            "magrittr",
            "Matrix",
            "pheatmap",
            "RANN",
            "RColorBrewer",
            "stringr",
            "tibble",
            "tidyr",
            "cowplot"
          ))

          BiocManager::install(version = "3.20", ask = FALSE, update = FALSE)

          remotes::install_version(
            "ggplot2",
            version = "3.5.1",
            repos = "https://cloud.r-project.org",
            upgrade = "never"
          )

          bioc_pkgs <- c(
            "AnnotationDbi",
            "BiocSingular",
            "biomaRt",
            "bluster",
            "DESeq2",
            "edgeR",
            "limma",
            "scater",
            "scran",
            "SingleCellExperiment"
          )

          BiocManager::install(
            bioc_pkgs,
            ask = FALSE,
            update = FALSE
          )

          remotes::install_github("zdebruine/RcppML", upgrade = "never")

          required_pkgs <- c(
            bioc_pkgs,
            "dplyr",
            "ggplot2",
            "ggrastr",
            "igraph",
            "magrittr",
            "Matrix",
            "pheatmap",
            "RANN",
            "RColorBrewer",
            "RcppML",
            "stringr",
            "tibble",
            "tidyr",
            "cowplot",
            "pkgload",
            "testthat",
            "knitr",
            "rmarkdown",
            "rcmdcheck"
          )

          missing <- required_pkgs[
            !vapply(required_pkgs, requireNamespace, logical(1), quietly = TRUE)
          ]

          if (length(missing) > 0) {
            stop(sprintf(
              "Failed to install/load: %s",
              paste(missing, collapse = ", ")
            ))
          }

          cat("All required non-optional packages installed successfully\n")
        shell: Rscript {0}

      - name: Install package
        run: |
          remotes::install_local(
            ".",
            dependencies = FALSE,
            upgrade = "never"
          )
        shell: Rscript {0}

      - name: R CMD check
        run: |
          rcmdcheck::rcmdcheck(
            args = c("--no-manual", "--as-cran"),
            error_on = "error",
            check_dir = "check"
          )
        shell: Rscript {0}

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-results
          path: check

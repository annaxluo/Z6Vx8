name: R-CMD-check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libharfbuzz-dev libfribidi-dev

      - name: Install Bioconductor packages
        run: |
          install.packages("BiocManager")
          BiocManager::install(version = "3.18", ask = FALSE, update = FALSE)
          BiocManager::install(c(
            "AnnotationDbi",
            "BiocSingular",
            "biomaRt",
            "bluster",
            "clusterProfiler",
            "DESeq2",
            "edgeR",
            "limma",
            "org.Hs.eg.db",
            "ReactomePA",
            "scater",
            "scran",
            "SingleCellExperiment"
          ), ask = FALSE, update = FALSE)
        shell: Rscript {0}

      - name: Install RcppML from GitHub
        run: |
          install.packages("remotes")
          remotes::install_github("zdebruine/RcppML")
        shell: Rscript {0}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          error-on: \'"error"\'


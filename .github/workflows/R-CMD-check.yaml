name: R-CMD-check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.0'
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libharfbuzz-dev libfribidi-dev

      - name: Install BiocManager
        run: |
          install.packages("BiocManager")
        shell: Rscript {0}

      - name: Install Bioconductor packages
        run: |
          BiocManager::install(version = "3.20", ask = FALSE, update = FALSE)
          BiocManager::install(c(
            "AnnotationDbi",
            "BiocSingular",
            "biomaRt",
            "bluster",
            "clusterProfiler",
            "DESeq2",
            "edgeR",
            "limma",
            "org.Hs.eg.db",
            "ReactomePA",
            "scater",
            "scran",
            "SingleCellExperiment"
          ), ask = FALSE, update = FALSE)
        shell: Rscript {0}

      - name: Install remotes
        run: |
          install.packages("remotes")
        shell: Rscript {0}

      - name: Install RcppML from GitHub
        run: |
          remotes::install_github("zdebruine/RcppML", upgrade = "never")
        shell: Rscript {0}

      - name: Install CRAN dependencies
        run: |
          install.packages(c(
            "dplyr",
            "ggplot2",
            "ggrastr",
            "igraph",
            "magrittr",
            "Matrix",
            "nebula",
            "pheatmap",
            "RANN",
            "RColorBrewer",
            "Seurat",
            "stringr",
            "tibble",
            "tidyr",
            "cowplot",
            "testthat",
            "knitr",
            "rmarkdown",
            "rcmdcheck"
          ))
        shell: Rscript {0}

      - name: Verify critical package versions
        run: |
          pkgs <- c("Matrix", "nebula", "bluster", "clusterProfiler", "scater", "scran", "ReactomePA")
          cat("Installed package versions:\n")
          for (pkg in pkgs) {
            if (require(pkg, character.only = TRUE)) {
              ver <- as.character(packageVersion(pkg))
              cat(sprintf("??? %s: %s\n", pkg, ver))
            } else {
              cat(sprintf("??? %s: NOT INSTALLED\n", pkg))
              stop(sprintf("%s not installed", pkg))
            }
          }
        shell: Rscript {0}

      - name: Install package
        run: |
          remotes::install_local(".", dependencies = FALSE)
        shell: Rscript {0}

      - name: R CMD check
        run: |
          rcmdcheck::rcmdcheck(
            args = c("--no-manual", "--as-cran"),
            error_on = "warning",
            check_dir = "check"
          )
        shell: Rscript {0}

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-results
          path: check
